<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
    <stop offset="0%"   stop-color="#11111b"/>
    <stop offset="100%" stop-color="#181825"/>
  </linearGradient>
  <linearGradient id="gbrand" x1="160" y1="439" x2="310" y2="191" gradientUnits="userSpaceOnUse">
    <stop offset="0%"   stop-color="#cba6f7"/>
    <stop offset="48%"  stop-color="#f5c2e7"/>
    <stop offset="100%" stop-color="#74c7ec"/>
  </linearGradient>
  <linearGradient id="gtitle" x1="640" y1="0" x2="1120" y2="0" gradientUnits="userSpaceOnUse">
    <stop offset="0%"   stop-color="#cba6f7"/>
    <stop offset="28%"  stop-color="#f5c2e7"/>
    <stop offset="60%"  stop-color="#74c7ec"/>
    <stop offset="100%" stop-color="#94e2d5"/>
  </linearGradient>
  <radialGradient id="orb1" cx="50%" cy="50%" r="50%">
    <stop offset="0%"   stop-color="#cba6f7" stop-opacity="0.20"/>
    <stop offset="100%" stop-color="#cba6f7" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="orb2" cx="50%" cy="50%" r="50%">
    <stop offset="0%"   stop-color="#74c7ec" stop-opacity="0.14"/>
    <stop offset="100%" stop-color="#74c7ec" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="orb3" cx="50%" cy="50%" r="50%">
    <stop offset="0%"   stop-color="#f5c2e7" stop-opacity="0.10"/>
    <stop offset="100%" stop-color="#f5c2e7" stop-opacity="0"/>
  </radialGradient>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .55 0"/>
  </filter>
</defs>

<rect width="1200" height="630" fill="url(#bg)"/>

<!-- Ambient orbs — same positions as og.svg -->
<ellipse cx="150"  cy="180"  rx="420" ry="370" fill="url(#orb1)"/>
<ellipse cx="1080" cy="500"  rx="380" ry="320" fill="url(#orb2)"/>
<ellipse cx="650"  cy="80"   rx="260" ry="200" fill="url(#orb3)"/>

<rect width="1200" height="630" filter="url(#grain)" opacity="0.068"/>

<!-- Outer border -->
<rect x="1" y="1" width="1198" height="628" fill="none" stroke="rgba(203,166,247,0.18)" stroke-width="2"/>

<!-- Inner accent lines -->
<line x1="60" y1="60" x2="1140" y2="60" stroke="rgba(203,166,247,0.08)" stroke-width="1"/>
<line x1="60" y1="570" x2="1140" y2="570" stroke="rgba(116,199,236,0.08)" stroke-width="1"/>

<!-- Corner marks -->
<path d="M60,60 L90,60 M60,60 L60,90" stroke="rgba(203,166,247,0.35)" stroke-width="2" fill="none"/>
<path d="M1140,60 L1110,60 M1140,60 L1140,90" stroke="rgba(203,166,247,0.35)" stroke-width="2" fill="none"/>
<path d="M60,570 L90,570 M60,570 L60,540" stroke="rgba(116,199,236,0.35)" stroke-width="2" fill="none"/>
<path d="M1140,570 L1110,570 M1140,570 L1140,540" stroke="rgba(116,199,236,0.35)" stroke-width="2" fill="none"/>

<!-- Column divider -->
<line x1="590" y1="100" x2="590" y2="530" stroke="rgba(203,166,247,0.10)" stroke-width="1"/>

<!-- Crown circuit symbol -->
<path d="M160.2 439.12L215.83999999999997 383.48L215.83999999999997 293.6" stroke="url(#gbrand)" stroke-width="4.5" fill="none" stroke-linecap="round"/>
<path d="M215.83999999999997 293.6L310.0 199.44L310.0 190.88" stroke="url(#gbrand)" stroke-width="4.5" fill="none" stroke-linecap="round"/>
<path d="M310.0 190.88L404.16 285.04L404.16 293.6" stroke="url(#gbrand)" stroke-width="4.5" fill="none" stroke-linecap="round"/>
<path d="M404.16 293.6L459.8 349.24L459.8 439.12" stroke="url(#gbrand)" stroke-width="4.5" fill="none" stroke-linecap="round"/>
<path d="M160.2 439.12L459.8 439.12" stroke="url(#gbrand)" stroke-width="4.5" fill="none" stroke-linecap="round"/>
<circle cx="160.2" cy="439.1" r="17.1" fill="#11111b" stroke="url(#gbrand)" stroke-width="2.5"/>
<circle cx="160.2" cy="439.1" r="6.4" fill="url(#gbrand)"/>
<circle cx="215.8" cy="293.6" r="17.1" fill="#11111b" stroke="url(#gbrand)" stroke-width="2.5"/>
<circle cx="215.8" cy="293.6" r="6.4" fill="url(#gbrand)"/>
<circle cx="310.0" cy="190.9" r="17.1" fill="#11111b" stroke="url(#gbrand)" stroke-width="2.5"/>
<circle cx="310.0" cy="190.9" r="6.4" fill="url(#gbrand)"/>
<circle cx="404.2" cy="293.6" r="17.1" fill="#11111b" stroke="url(#gbrand)" stroke-width="2.5"/>
<circle cx="404.2" cy="293.6" r="6.4" fill="url(#gbrand)"/>
<circle cx="459.8" cy="439.1" r="17.1" fill="#11111b" stroke="url(#gbrand)" stroke-width="2.5"/>
<circle cx="459.8" cy="439.1" r="6.4" fill="url(#gbrand)"/>

<!-- OACH wordmark -->
<text x="640" y="365"
  font-family="'Courier New',Courier,monospace"
  font-size="152" font-weight="800"
  fill="url(#gtitle)"
  letter-spacing="-0.06em">OACH</text>

<text x="642" y="425"
  font-family="'Courier New',Courier,monospace"
  font-size="21" fill="#7f849c"
  letter-spacing="0.05em">Ingeniería Electrónica · FOSS · Soberanía Digital</text>

<line x1="640" y1="453" x2="1000" y2="453"
  stroke="rgba(203,166,247,0.20)" stroke-width="1"/>

<text x="642" y="483"
  font-family="'Courier New',Courier,monospace"
